services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: my-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mini_e_db
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: 'mysql_native_password'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # 2. Backend API (Node.js)
  backend:
    image: huyhoang2609/my-project-backend:latest
    container_name: my-backend
    restart: always
    
    # --- SỬA LỖI 1: Mở cổng tường minh để debug được bằng curl ---
    ports:
      - "3000:3000"
    
    command: bash -c "sleep 10 && npm run start"

    environment:
      # Database
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root123
      DB_NAME: mini_e_db
      DB_SSL: "false"

      # App
      PORT: 3000
      NODE_ENV: development # Để xem log lỗi chi tiết
      BCRYPT_SALT_ROUNDS: 12
      BCRYPT_PEPPER: quochiepdepzai
      
      # JWT
      ACCESS_TOKEN_SECRET: dev_access_secret_change_me
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_SECRET: dev_refresh_secret_change_me
      REFRESH_TOKEN_EXPIRES: 7d
      REFRESH_COOKIE_NAME: refreshToken

      # Email (Gmail Port 465/SSL)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: quochiep1610@gmail.com
      SMTP_PASS: xbrukrqfxqlfzbdd
      MAIL_FROM: quochiep1610@gmail.com

      # --- SỬA LỖI 2: Bỏ qua lỗi chứng chỉ SSL trong Docker ---
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

      # OTP
      OTP_WINDOW_MINUTES: 5
      OTP_RESEND_COOLDOWN_SECONDS: 60

    depends_on:
      - db
    networks:
      - app-network

  # 3. Frontend React/Nginx
  frontend:
    image: huyhoang2609/my-project-frontend:latest
    container_name: my-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
