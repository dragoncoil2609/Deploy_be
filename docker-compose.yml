services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: my-mysql
    # Cổng 3306 đã được ẩn (không có ports) để bảo mật
    environment:
      # Đã điền mật khẩu cứng để khớp với Backend
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mini_e_db
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: 'mysql_native_password'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

 # 2. Backend API (Node.js)
  backend:
    image: huyhoang2609/my-project-backend:latest
    container_name: my-backend
    restart: always
    expose:
      - "3000"
    
    # Lệnh sleep giữ nguyên 10s để đợi DB
    command: bash -c "sleep 10 && npm run start"

    environment:
      # --- CẤU HÌNH DATABASE (Giữ nguyên để khớp với Container DB hiện tại) ---
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root123    # <--- Lưu ý: Dùng mật khẩu hiện tại của Docker (root123)
      DB_NAME: mini_e_db  # <--- Dùng tên DB hiện tại của Docker
      DB_SSL: "false"

      # --- CẤU HÌNH APP & JWT (Lấy từ .env của bạn) ---
      PORT: 3000
      NODE_ENV: development # Chạy trên server nên để production
      BCRYPT_SALT_ROUNDS: 12
      BCRYPT_PEPPER: quochiepdepzai
      
      ACCESS_TOKEN_SECRET: dev_access_secret_change_me
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_SECRET: dev_refresh_secret_change_me
      REFRESH_TOKEN_EXPIRES: 7d
      REFRESH_COOKIE_NAME: refreshToken

      # --- CẤU HÌNH EMAIL (QUAN TRỌNG NHẤT ĐỂ FIX LỖI 500) ---
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465   # <--- Đã sửa thành 465 theo file gốc
      SMTP_SECURE: "true" # <--- Đã sửa thành true (SSL)
      SMTP_USER: quochiep1610@gmail.com
      SMTP_PASS: xbrukrqfxqlfzbdd
      MAIL_FROM: quochiep1610@gmail.com

      # --- CẤU HÌNH OTP ---
      OTP_WINDOW_MINUTES: 5
      OTP_RESEND_COOLDOWN_SECONDS: 60

    depends_on:
      - db
    networks:
      - app-network

  # 3. Frontend React/Nginx
  frontend:
    # Đã chuyển lại dùng IMAGE vì trên Server bạn không có source code để BUILD
    image: huyhoang2609/my-project-frontend:latest
    container_name: my-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
