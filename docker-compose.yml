version: '3.8'

services:
  # Database
db:
    image: mysql:8.0
    container_name: my-mysql
    environment:
      # --- Giữ nguyên các biến cũ ---
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: my_database_name
      # ------------------------------
      
      # 💡 THÊM 2 DÒNG NÀY ĐỂ FIX KẾT NỐI TỪ XA:
      MYSQL_ROOT_HOST: "%" # Cho phép root user kết nối từ MỌI NƠI (cần thiết)
      MYSQL_AUTHENTICATION_PLUGIN: 'mysql_native_password' # Dùng plugin tương thích với Workbench
      
    volumes:
      - mysql_data:/var/lib/mysql 
    ports:
      - "3306:3306" # Đảm bảo port này có
    networks:
      - app-network

  # Backend API
  backend:
    # Image này được build từ Repo Backend
    image: huyhoang2609/my-project-backend:latest
    container_name: my-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword123
      DB_NAME: my_database
    depends_on:
      - db
    networks:
      - app-network

  # Frontend
  frontend:
    # Image này được build từ Repo Frontend (quan trọng tên phải khớp)
    image: huyhoang2609/my-project-frontend:latest
    container_name: my-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
