services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: my-mysql
    # Cổng 3306 đã được ẩn (không có ports) để bảo mật
    environment:
      # Đã điền mật khẩu cứng để khớp với Backend
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mini_e_db
      MYSQL_ROOT_HOST: "%"
      MYSQL_AUTHENTICATION_PLUGIN: 'mysql_native_password'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # 2. Backend API (Node.js)
  backend:
    image: huyhoang2609/my-project-backend:latest
    container_name: my-backend
    restart: always
    expose:
      - "3000" # Chỉ mở nội bộ cho Nginx

    # Đã sửa lỗi 'sleep missing operand' bằng cách điền số 10 trực tiếp
    command: bash -c "sleep 10 && npm run start"

    environment:
      DB_HOST: db
      DB_USER: root
      # Mật khẩu này PHẢI KHỚP với MYSQL_ROOT_PASSWORD ở trên
      DB_PASS: root123
      DB_NAME: mini_e_db
      
      # Điền tạm thông tin SMTP để tránh lỗi crash (bạn sửa lại sau nếu cần gửi mail thật)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: user@example.com
      SMTP_PASS: password123
      
    depends_on:
      - db
    networks:
      - app-network

  # 3. Frontend React/Nginx
  frontend:
    # Đã chuyển lại dùng IMAGE vì trên Server bạn không có source code để BUILD
    image: huyhoang2609/my-project-frontend:latest
    container_name: my-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
